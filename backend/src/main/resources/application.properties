spring.application.name=backlogd-api

# Local secrets live in backend/.env (git-ignored). See .env.example for the keys.
spring.config.import=optional:file:.env[.properties]

# --- Database ---
# Connects to an existing database (default: "postgres") and keeps all tables
# inside the "backlogd" schema, which Flyway creates automatically on first run.
app.db.schema=backlogd
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?currentSchema=${app.db.schema}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.schemas=${app.db.schema}
spring.flyway.default-schema=${app.db.schema}
spring.flyway.create-schemas=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=${app.db.schema}
spring.jpa.open-in-view=false

# --- Auth ---
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl=7d

# --- CORS (Vite dev server) ---
app.cors.allowed-origins=http://localhost:5173
